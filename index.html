    // Componente del Gráfico de Radar usando Canvas Nativo HTML5
    const RadarChart = ({ data, width = 340, height = 300 }) => {
      const canvasRef = React.useRef(null);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);

        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(centerX, centerY) - 50;
        const numSides = data.length;
        const angleStep = (Math.PI * 2) / numSides;

        ctx.clearRect(0, 0, width, height);

        // Anillos concéntricos de escala (1 a 5)
        for (let level = 1; level <= 5; level++) {
          const r = (radius / 5) * level;
          ctx.beginPath();
          for (let i = 0; i < numSides; i++) {
            const angle = i * angleStep - Math.PI / 2;
            const x = centerX + r * Math.cos(angle);
            const y = centerY + r * Math.sin(angle);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.strokeStyle = level === 5 ? '#cbd5e1' : '#f1f5f9';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // Ejes radiales
        for (let i = 0; i < numSides; i++) {
          const angle = i * angleStep - Math.PI / 2;
          const x = centerX + radius * Math.cos(angle);
          const y = centerY + radius * Math.sin(angle);
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(x, y);
          ctx.strokeStyle = '#e2e8f0';
          ctx.stroke();

          // Etiquetas de los ejes
          const labelR = radius + 22;
          const labelX = centerX + labelR * Math.cos(angle);
          const labelY = centerY + labelR * Math.sin(angle);

          ctx.font = '600 10px Inter, sans-serif';
          ctx.fillStyle = '#475569';
          ctx.textAlign = Math.abs(Math.cos(angle)) < 0.1 ? 'center' : Math.cos(angle) > 0 ? 'left' : 'right';
          ctx.textBaseline = 'middle';
          ctx.fillText(data[i].label, labelX, labelY);
        }

        // Polígono de Datos del Usuario
        ctx.beginPath();
        data.forEach((d, i) => {
          const val = Math.max(1, Math.min(5, d.value));
          const r = (radius / 5) * val;
          const angle = i * angleStep - Math.PI / 2;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = 'rgba(79, 70, 229, 0.25)';
        ctx.fill();
        ctx.strokeStyle = '#4f46e5';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Puntos sobre los vértices
        data.forEach((d, i) => {
          const val = Math.max(1, Math.min(5, d.value));
          const r = (radius / 5) * val;
          const angle = i * angleStep - Math.PI / 2;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);

          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#4f46e5';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });

      }, [data, width, height]);

      return (
        <div className="flex justify-center items-center my-2">
          <canvas 
            ref={canvasRef} 
            style={{ width: `${width}px`, height: `${height}px` }} 
            className="max-w-full h-auto"
          />
        </div>
      );
    };

      const handleNextQuestion = () => {
        if (currentQuestionIndex < QUESTIONS.length - 1) {

        } else {
          submitResults();
        }
      };

      const handlePrevQuestion = () => {
        if (currentQuestionIndex > 0) {
          setCurrentQuestionIndex(prev => prev - 1);
        }
      };

      const calculateTotalScore = (answersObj = answers) => {
        return Object.values(answersObj).reduce((acc, curr) => acc + (Number(curr) || 0), 0);

      const getMaturityLevel = (score) => {
        if (score >= 23) return { level: 'Consolidado', color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-200', barBg: 'bg-emerald-500' };

        return { level: 'Inicial', color: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-indigo-200', barBg: 'bg-indigo-500' };
      };

      const submitResults = async () => {
        setIsSubmitting(true);
        const score = calculateTotalScore();
        const maturity = getMaturityLevel(score);

          id: Date.now(),
          ...userData,
          date: new Date().toISOString().split('T')[0],

        const rows = submissions.map(s => [
          `"${s.name}"`,
          `"${s.email}"`,

          s.date,
          s.score,
          `"${s.level}"`,
          s.answers?.q1 || '',
          s.answers?.q2 || '',
          s.answers?.q3 || '',

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);

        document.body.appendChild(link);

                    className="text-xs font-semibold text-slate-600 hover:text-indigo-600 px-3 py-1.5 rounded-lg border border-slate-200 transition-colors flex items-center space-x-1.5"
                  >
                    <RefreshCw className="w-3.5 h-3.5" />
                    <span>Volver al Inicio</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="max-w-3xl mx-auto px-4 py-8 flex-1 w-full">

            {/* 1. ONBOARDING Y REGISTRO DE PARTICIPANTE */}
            {step === 'welcome' && (
              <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-10 space-y-8 animate-fadeIn">
                <div className="text-center space-y-3">
                  <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100">
                    <Sparkles className="w-3.5 h-3.5 mr-1.5" /> Herramienta para Emprendedores
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                    Evalúa la Potencia de tu Propuesta
                  </h2>
                  <p className="text-slate-600 text-sm sm:text-base max-w-xl mx-auto leading-relaxed">
                    Identifica brechas críticas en tu modelo de negocio respondiendo 6 dimensiones clave de validación, claridad, diferenciación y canales.
                  </p>
                </div>

                <form onSubmit={handleStartSurvey} className="space-y-4 max-w-md mx-auto pt-2">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Tu Nombre Completo *
                    </label>
                    <input 
                      type="text" 
                      required
                      placeholder="ej. Laura Morales"
                      value={userData.name}
                      onChange={e => setUserData({...userData, name: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Correo Electrónico *
                    </label>
                    <input 
                      type="email" 
                      required
                      placeholder="ej. laura@miempresa.com"
                      value={userData.email}
                      onChange={e => setUserData({...userData, email: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Nombre del Proyecto / Emprendimiento *
                    </label>
                    <input 
                      type="text" 
                      required
                      placeholder="ej. EcoSmart Pack"
                      value={userData.project}
                      onChange={e => setUserData({...userData, project: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm"
                    />
                  </div>

                  <button 
                    type="submit"
                    className="w-full py-3.5 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition-all flex items-center justify-center space-x-2 text-base pt-3"
                  >
                    <span>Comenzar Diagnóstico</span>
                    <ChevronRight className="w-5 h-5" />
                  </button>
                </form>

                <div className="grid grid-cols-3 gap-4 pt-6 border-t border-slate-100 text-center">
                  <div>
                    <p className="text-lg font-bold text-slate-800">6 Áreas</p>
                    <p className="text-xs text-slate-500">Evaluación 360°</p>
                  </div>
                  <div>
                    <p className="text-lg font-bold text-slate-800">~ 3 Min</p>
                    <p className="text-xs text-slate-500">Tiempo de respuesta</p>
                  </div>
                  <div>
                    <p className="text-lg font-bold text-slate-800">Radar 2D</p>
                    <p className="text-xs text-slate-500">Gráfico interactivo</p>
                  </div>
                </div>
              </div>
            )}

            {/* 2. CUESTIONARIO DINÁMICO */}
            {step === 'survey' && currentQ && (
              <div className="space-y-6 animate-fadeIn">
                {/* Barra de Progreso */}
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                  <div className="flex justify-between items-center text-xs font-bold text-slate-500 mb-2">
                    <span>Pregunta {currentQuestionIndex + 1} de {QUESTIONS.length}</span>
                    <span className="text-indigo-600">{Math.round(((currentQuestionIndex + 1) / QUESTIONS.length) * 100)}% Completado</span>
                  </div>
                  <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div 
                      className="bg-indigo-600 h-full rounded-full transition-all duration-300 ease-out"
                      style={{ width: `${((currentQuestionIndex + 1) / QUESTIONS.length) * 100}%` }}
                    ></div>
                  </div>
                </div>

                {/* Tarjeta de Pregunta */}
                <div className="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-8 space-y-6">
                  <div className="space-y-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md inline-block">
                      {currentQ.category}
                    </span>
                    <h3 className="text-xl sm:text-2xl font-bold text-slate-900 leading-snug">
                      {currentQ.question}
                    </h3>
                    <p className="text-sm text-slate-500 leading-relaxed">
                      {currentQ.description}
                    </p>
                  </div>

                  {/* Opciones de Nivel */}
                  <div className="space-y-3 pt-2">
                    {currentQ.options.map((opt) => {
                      const isSelected = answers[currentQ.id] === opt.value;
                      return (
                        <button
                          key={opt.value}
                          type="button"
                          onClick={() => handleSelectOption(currentQ.id, opt.value)}
                          className={`w-full text-left p-4 rounded-xl border transition-all flex items-start space-x-3.5 ${
                            isSelected 
                              ? 'border-indigo-600 bg-indigo-50/70 ring-2 ring-indigo-500/20 text-indigo-950 font-semibold shadow-sm' 
                              : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700'
                          }`}
                        >
                          <div className={`mt-0.5 w-5 h-5 rounded-full border flex items-center justify-center shrink-0 transition-colors ${
                            isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white'
                          }`}>
                            {isSelected && <CheckCircle className="w-3.5 h-3.5" />}
                          </div>
                          <span className="text-sm sm:text-base leading-snug">{opt.label}</span>
                        </button>
                      );
                    })}
                  </div>

                  {/* Controles de Navegación */}
                  <div className="flex justify-between items-center pt-6 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={handlePrevQuestion}
                      disabled={currentQuestionIndex === 0}
                      className={`flex items-center space-x-1 px-4 py-2.5 rounded-xl font-semibold text-sm transition-colors ${
                        currentQuestionIndex === 0 
                          ? 'text-slate-300 cursor-not-allowed' 
                          : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <ChevronLeft className="w-4 h-4" />
                      <span>Anterior</span>
                    </button>

                    <button
                      type="button"
                      disabled={!answers[currentQ.id]}
                      onClick={handleNextQuestion}
                      className={`flex items-center space-x-2 px-6 py-2.5 rounded-xl font-bold text-sm shadow-md transition-all ${
                        !answers[currentQ.id]
                          ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none'
                          : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200'
                      }`}
                    >
                      {isSubmitting ? (
                        <span>Procesando...</span>
                      ) : currentQuestionIndex === QUESTIONS.length - 1 ? (
                        <span>Finalizar Diagnóstico</span>
                      ) : (
                        <>
                          <span>Siguiente</span>
                          <ChevronRight className="w-4 h-4" />
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 3. RESULTADOS, GRÁFICO DE RADAR Y PLAN DE ACCIÓN */}
            {step === 'results' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 space-y-8 print:p-0 print:shadow-none print:border-none">
                  
                  {/* Encabezado del Reporte */}
                  <div className="text-center space-y-2 pb-6 border-b border-slate-100">
                    <div className="inline-flex items-center justify-center w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full mb-1">
                      <Award className="w-6 h-6" />
                    </div>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">
                      Reporte de Propuesta de Valor
                    </h2>
                    <p className="text-sm text-slate-500">
                      Proyecto: <span className="font-bold text-slate-800">{userData.project}</span> • Emprendedor/a: <span className="font-semibold text-slate-700">{userData.name}</span>
                    </p>
                  </div>

                  {/* Nivel de Madurez */}
                  <div className={`p-6 rounded-2xl border ${maturityInfo.bg} ${maturityInfo.border} text-center space-y-3`}>
                    <span className="text-xs font-extrabold uppercase tracking-widest text-slate-500">Nivel de Madurez Estratégica</span>
                    <div className="flex items-center justify-center space-x-3">
                      <span className={`text-3xl sm:text-4xl font-black ${maturityInfo.color}`}>
                        {maturityInfo.level}
                      </span>
                      <span className="text-2xl font-bold text-slate-700 bg-white/90 px-3 py-1 rounded-xl shadow-sm border border-slate-200/60">
                        {totalScore} / 30 pts
                      </span>
                    </div>

                    <p className="pt-1 text-sm text-slate-700 max-w-xl mx-auto leading-relaxed">
                      {maturityInfo.level === 'Consolidado' && '🔥 Tu propuesta posee alta deseabilidad, tracción y defensibilidad. Enfócate en la optimización de canales de escala y conversión.'}
                      {maturityInfo.level === 'En Desarrollo' && '🚀 Base sólida creada. Presentas buen potencial pero requieres fortalecer la diferenciación y reducir barreras de entrada.'}
                      {maturityInfo.level === 'Inicial' && '💡 Propuesta en fase de hipótesis. Tu prioridad número uno debe ser salir a validar el dolor real del cliente mediante experimentos.'}
                    </p>
                  </div>

                  {/* Gráfico de Radar Interactivo */}
                  <div className="space-y-3 pt-2">
                    <h3 className="font-bold text-slate-800 text-base flex items-center space-x-2">
                      <BarChart className="w-4 h-4 text-indigo-600" />
                      <span>Matriz Radial de Fortalezas y Brechas</span>
                    </h3>
                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-center">
                      <RadarChart data={radarData} width={340} height={290} />
                    </div>
                  </div>

                  {/* Recomendaciones Tácticas Personalizadas */}
                  <div className="space-y-4 pt-2">
                    <h3 className="font-bold text-slate-800 text-base flex items-center space-x-2">
                      <Lightbulb className="w-4 h-4 text-amber-500" />
                      <span>Plan de Acción Táctico Recomendado</span>
                    </h3>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {/* Fortalezas Clave */}
                      <div className="p-4 rounded-xl bg-emerald-50/60 border border-emerald-100 space-y-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-emerald-800 block">
                          💪 Principales Fortalezas
                        </span>
                        <ul className="space-y-2 text-xs text-slate-700">
                          {topStrengths.map(q => (
                            <li key={q.id} className="leading-relaxed">
                              <strong>{q.category}:</strong> {q.tactics.high}
                            </li>
                          ))}
                        </ul>
                      </div>

                      {/* Áreas Prioritarias de Mejora */}
                      <div className="p-4 rounded-xl bg-indigo-50/60 border border-indigo-100 space-y-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-indigo-800 block">
                          🎯 Oportunidades de Mejora
                        </span>
                        <ul className="space-y-2 text-xs text-slate-700">
                          {topImprovements.map(q => (
                            <li key={q.id} className="leading-relaxed">
                              <strong>{q.category}:</strong> {q.tactics.low}
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  </div>

                  {/* Desglose Detallado */}
                  <div className="space-y-3 pt-2">
                    <h3 className="font-bold text-slate-800 text-base">Puntaje por Dimensión</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {QUESTIONS.map((q) => {
                        const val = answers[q.id] || 0;
                        return (
                          <div key={q.id} className="p-3 rounded-xl border border-slate-100 bg-slate-50/60 space-y-1.5">
                            <div className="flex justify-between items-center text-xs">
                              <span className="font-semibold text-slate-700">{q.category}</span>
                              <span className="font-bold text-indigo-600 bg-white px-2 py-0.5 rounded border border-slate-200">
                                {val} / 5
                              </span>
                            </div>
                            <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                              <div className="bg-indigo-600 h-full rounded-full" style={{ width: `${(val / 5) * 100}%` }}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Acciones del Reporte */}
                  <div className="flex flex-col sm:flex-row gap-3 pt-4 border-t border-slate-100 print:hidden">
                    <button
                      onClick={() => window.print()}
                      className="flex-1 py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm transition-colors flex items-center justify-center space-x-2 shadow-md"
                    >
                      <Download className="w-4 h-4" />
                      <span>Imprimir / Guardar PDF</span>
                    </button>

                    <button
                      onClick={() => {
                        setAnswers({});
                        setStep('welcome');
                      }}
                      className="py-3 px-4 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold text-sm transition-colors flex items-center justify-center space-x-2"
                    >
                      <RefreshCw className="w-4 h-4" />
                      <span>Nuevo Diagnóstico</span>
                    </button>
                  </div>

                </div>
              </div>
            )}

            {/* 4. PANEL DEL FACILITADOR / ANALÍTICA */}
            {step === 'admin' && (
              <div className="space-y-6 animate-fadeIn">
                {!isAdminAuthenticated ? (
                  /* Autenticación Facilitador */
                  <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 max-w-md mx-auto text-center space-y-6">
                    <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto">
                      <Lock className="w-6 h-6" />
                    </div>
                    <div>
                      <h2 className="text-xl font-bold text-slate-900">Acceso al Panel Facilitador</h2>
                      <p className="text-xs text-slate-500 mt-1">Ingresa la clave docente para gestionar y ver las respuestas del grupo.</p>
                    </div>

                    <form onSubmit={handleAdminLogin} className="space-y-4">
                      <div>
                        <input 
                          type="password"
                          placeholder="Clave"
                          value={adminPassword}
                          onChange={e => setAdminPassword(e.target.value)}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                        />
                        {adminError && <p className="text-xs text-red-500 mt-1.5 font-medium">{adminError}</p>}
                      </div>

                      <button 
                        type="submit"
                        className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-md transition-colors"
                      >
                        Ingresar al Dashboard
                      </button>
                    </form>
                  </div>
                ) : (
                  /* Dashboard Facilitador */
                  <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900 flex items-center space-x-2">
                          <Users className="w-5 h-5 text-indigo-600" />
                          <span>Panel del Facilitador</span>
                        </h2>
                        <p className="text-xs text-slate-500">Métricas consolidadas del taller</p>
                      </div>

                      <div className="flex items-center space-x-2 w-full sm:w-auto">
                        <button
                          onClick={exportToCSV}
                          className="flex-1 sm:flex-none px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center justify-center space-x-1.5 transition-colors shadow-sm"
                        >
                          <Download className="w-3.5 h-3.5" />
                          <span>Exportar CSV</span>
                        </button>
                        <button
                          onClick={() => setIsAdminAuthenticated(false)}
                          className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center space-x-1 transition-colors"
                        >
                          <LogOut className="w-3.5 h-3.5" />
                          <span>Salir</span>
                        </button>
                      </div>
                    </div>

                    {/* Métricas Agregadas */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-100 text-center">
                        <p className="text-xs text-slate-500 font-semibold uppercase tracking-wider">Total Evaluaciones</p>
                        <p className="text-2xl font-black text-slate-900 mt-1">{submissions.length}</p>
                      </div>
                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-100 text-center">
                        <p className="text-xs text-slate-500 font-semibold uppercase tracking-wider">Promedio General</p>
                        <p className="text-2xl font-black text-indigo-600 mt-1">
                          {submissions.length ? (submissions.reduce((acc, s) => acc + s.score, 0) / submissions.length).toFixed(1) : '0'} / 30
                        </p>
                      </div>
                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-100 text-center">
                        <p className="text-xs text-slate-500 font-semibold uppercase tracking-wider">% Consolidados</p>
                        <p className="text-2xl font-black text-emerald-600 mt-1">
                          {submissions.length ? Math.round((submissions.filter(s => s.level === 'Consolidado').length / submissions.length) * 100) : 0}%
                        </p>
                      </div>
                    </div>

                    {/* Buscador de Participantes */}
                    <div className="flex items-center space-x-2">
                      <input 
                        type="text"
                        placeholder="Buscar por participante, proyecto o email..."
                        value={searchTerm}
                        onChange={e => setSearchTerm(e.target.value)}
                        className="w-full px-4 py-2 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>

                    {/* Tabla de Registros */}
                    <div className="overflow-x-auto rounded-xl border border-slate-200">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 text-slate-600 font-bold uppercase tracking-wider border-b border-slate-200">
                          <tr>
                            <th className="p-3">Participante</th>
                            <th className="p-3">Proyecto</th>
                            <th className="p-3 text-center">Puntaje</th>
                            <th className="p-3">Nivel</th>
                            <th className="p-3 text-right">Fecha</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-slate-700">
                          {filteredSubmissions.length === 0 ? (
                            <tr>
                              <td colSpan="5" className="p-6 text-center text-slate-400">No se encontraron evaluaciones asociadas.</td>
                            </tr>
                          ) : (
                            filteredSubmissions.map((sub) => (
                              <tr key={sub.id} className="hover:bg-slate-50/80 transition-colors">
                                <td className="p-3 font-medium text-slate-900">
                                  <div>{sub.name}</div>
                                  <div className="text-[10px] text-slate-400">{sub.email}</div>
                                </td>
                                <td className="p-3 font-medium text-slate-800">{sub.project}</td>
                                <td className="p-3 text-center font-bold text-indigo-600">{sub.score} / 30</td>
                                <td className="p-3">
                                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                    sub.level === 'Consolidado' ? 'bg-emerald-100 text-emerald-800' :
                                    sub.level === 'En Desarrollo' ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-800'
                                  }`}>
                                    {sub.level}
                                  </span>
                                </td>
                                <td className="p-3 text-right text-slate-400">{sub.date}</td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>

                  </div>
                )}
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 print:hidden">
            <div className="max-w-5xl mx-auto px-4 text-center text-xs text-slate-400">
              Diagnóstico Avanzado de Propuesta de Valor • Herramienta de Evaluación Estratégica
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
